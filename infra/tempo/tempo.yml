server:
  http_listen_port: 3200

# OTLP is the only receiver enabled — it's what the OpenTelemetry Java
# agent (ADR 0003) will ship spans over from M4 onward.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
